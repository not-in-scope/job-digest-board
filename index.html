const state={q:'',loc:'All',tier:'All'};
function render(){
  const now=Date.now();
  const rows=JOBS.filter(j=>{
    if(state.loc!=='All'&&j.bucket!==state.loc)return false;
    if(state.tier==='Network'&&j.tier!=='network')return false;
    if(state.tier==='Strong'&&j.tier!=='strong'&&j.tier!=='network')return false;
    if(state.tier==='Good'&&j.tier==='other')return false;
    const q=state.q.toLowerCase();
    return !q||j.title.toLowerCase().includes(q)||j.company.toLowerCase().includes(q);
  }).map(j=>{
    const isNew=(now-Date.parse(j.posted))<48*3600*1000;
    const cls=j.score>=65?'s':(j.score>=45?'g':'o');
    const tag=j.tier==='network'?'<span class="tag">\u2605 network</span>':'';
    const rm=j.role10>=8?`<span class="tag rm" title="This job description closely matches your resume — worth applying even outside your usual sectors.">resume match</span>`:'';
    const comp=j.comp?esc(j.comp):'<span class="na">\u2014</span>';
    const fb=`<div class="fb"><a href="${att(j.yes)}">\ud83d\udc4d interested</a><a href="${att(j.no)}">\u2715 skip</a></div>`;
    return `<tr><td><span class="pill ${cls}" title="Fit score 0–100: sector weight + title keywords + job-description signals + your feedback. Strong ≥65, good ≥45.">${j.score}</span></td>`+
      `<td class="role"><a href="${att(j.url)}">${esc(j.title)}</a>`+
      `${isNew?'<span class="badge">NEW</span>':''}${tag}${rm}`+
      `<div class="blurb">${esc(j.blurb)}</div>${fb}</td>`+
      `<td>${esc(j.company_display||cap(j.company))}</td><td>${esc(j.bucket)}</td><td>${comp}</td>`+
      `<td class="mono">${esc(j.source)}</td><td class="mono">${ago(j.posted,now)}</td></tr>`;
  });
  document.querySelector('tbody').innerHTML=rows.join('')||
    '<tr><td colspan="7" style="color:#5A6B7A">No matches for this filter.</td></tr>';
  document.getElementById('count').textContent=rows.length;
}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function att(s){return esc(s).replace(/"/g,'&quot;')}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function ago(iso,now){if(!iso)return '\u2014';const h=(now-Date.parse(iso))/3600000;
  return h<48?`${Math.floor(h)}h ago`:`${Math.floor(h/24)}d ago`}
document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value;render()});
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  const grp=c.dataset.group;state[grp]=c.dataset.val;
  document.querySelectorAll(`.chip[data-group=${grp}]`).forEach(x=>x.classList.toggle('on',x===c));
  render();
}));
render();
